<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b52">
<title>Booking JOS | Jasa Orang Suruhan</title>

<style>
:root {
  --navy:#102b52;
  --blue:#1769d2;
  --light:#f3f7fc;
  --text:#17243a;
  --muted:#6b7890;
  --border:#e0e7f0;
  --green:#16834a;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--light);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
}
.topbar {
  background:var(--navy);
  color:white;
  padding:22px 18px 30px;
}
.nav {
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}
.logo {
  width:50px;
  height:50px;
  background:white;
  color:var(--navy);
  border-radius:14px;
  display:flex;
  justify-content:center;
  align-items:center;

}
.brand {font-size:20px;font-weight:800}
.tagline {font-size:12px;color:#d3e2f7}
.hero {
  max-width:760px;
  margin:25px auto 0;
}
.hero h1 {
  font-size:29px;
  line-height:1.2;
  margin:0 0 10px;
}
.hero p {
  color:#d7e5f8;
  margin:0;
  font-size:14px;
}
.container {
  max-width:760px;

  padding:0 14px 35px;
}
.card {
  background:white;

  padding:20px;
  margin-bottom:15px;

  border:1px solid #edf1f6;
}
.card h2 {
  font-size:17px;
  margin:0 0 5px;
}
.desc {
  font-size:12px;
  color:var(--muted);
  margin:0 0 18px;
}
label {
  display:block;
  font-size:13px;
  font-weight:700;
  margin:15px 0 7px;
}
input,select,textarea {
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  color:var(--text);
  outline:none;
}
input:focus,select:focus,textarea:focus {
  border-color:var(--blue);
}
textarea {resize:vertical;min-height:85px}
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.service-intro {
  padding:14px;
  border-radius:12px;
  background:#edf5ff;
  color:#234b80;
  font-size:13px;
  margin-bottom:14px;
}
.pricebox {
  background:#f5f8fd;
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  margin-top:18px;
}
.price-title {
  font-size:13px;
  color:var(--muted);
  margin-bottom:8px;
}
.price-row {
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:13px;
  margin:8px 0;
}
.price-row span:last-child {
  text-align:right;
  font-weight:700;
}
.total {
  border-top:1px solid #d9e2ef;
  margin-top:12px;
  padding-top:13px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}
.total span:first-child {font-weight:800}
.total strong {
  color:var(--blue);
  font-size:22px;
}
.note {
  font-size:11px;
  color:var(--muted);
  margin-top:12px;
}
.btn {
  width:100%;
  display:block;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  text-align:center;
}
.btn-primary {
  background:var(--blue);
  color:white;
  margin-top:17px;
}
.btn-primary:active {opacity:.85}
.trust {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}
